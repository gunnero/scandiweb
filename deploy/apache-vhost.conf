<VirtualHost *:80>
    ServerName _default_
    DocumentRoot /var/www/html

    Alias /graphql /var/www/app/public/index.php
    Alias /health /var/www/app/public/index.php

    <Directory /var/www/app/public>
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
